version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/.cache/**/*
      - .next/cache/**/*
  # ------------------------------------------------------------------
  # Environment variables — set these in the Amplify console (App settings →
  # Environment variables). Never commit secrets. Build/SSR works with the
  # localhost defaults, but the app will not reach the real backend until
  # these point at the deployed backend.
  #
  #   NEXT_PUBLIC_API_URL   public backend origin (BFF relays here in browser)
  #   NEXT_PUBLIC_APP_URL   this app's canonical origin (the Amplify domain)
  #   BACKEND_API_URL       backend origin used ONLY by server-side BFF handlers
  #   SESSION_COOKIE_NAME   httpOnly refresh cookie name (default: __session)
  #   NEXT_PUBLIC_SENTRY_DSN, SENTRY_DSN   optional error reporting
  #   NEXT_PUBLIC_ENABLE_REGISTRATION      "true" | "false"
  #   NEXT_PUBLIC_ENABLE_SSO               "true" | "false"
  # ------------------------------------------------------------------
